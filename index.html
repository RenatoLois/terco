      <button type="button">

      </button>

      <div class="flex justify-center items-center gap-4">
        <button type="button" onclick="pecaAnterior();">
          <i class="fa-solid fa-backward-step transform hover:scale-115 duration-300 text-[1.8rem]"></i>
        </button>

      </button>

      </button>
